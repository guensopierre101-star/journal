<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE10th Journal</title>

<!-- Konfigirasyon pou fè l parèt tankou yon Aplikasyon (PWA) -->
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22THE10th%20Journal%22%2C%22short_name%22%3A%22THE10th%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f4f5f9%22%2C%22theme_color%22%3A%22%236c4fe0%22%2C%22icons%22%3A%5B%5D%7D">
<meta name="theme-color" content="#6c4fe0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="THE10th">

<style>
:root{--bg:#f4f5f9;--sd:#fff;--card:#fff;--line:#e6e8f0;--tx:#1d1b4b;--mu:#6b7090;--ac:#6c4fe0;--g:#3dbb87;--r:#e5605c;--b:#6c63ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d1a;--sd:#080a15;--card:#0f1428;--line:#252d4a;--tx:#e8eaf6;--mu:#8b93b5;--ac:#7c6cf0;--g:#2ecc9a;--r:#ef5b5b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;min-height:100vh}
aside{width:200px;flex:none;background:var(--sd);border-right:1px solid var(--line);padding:16px 10px}
.lg{font-weight:700;font-size:17px;margin:0 8px 16px;color:var(--ac)}
.lgo{display:inline-flex;border:2px solid #f2b705;background:#020b1f}.lgo b{color:#f2b705;font-size:15px;line-height:1;padding:7px 10px;letter-spacing:.3px}.lgo b+b{border-left:2px solid #f2b705}
nav button{display:block;width:100%;text-align:left;border:0;background:none;margin-bottom:4px}
nav button.on{background:var(--ac);color:#fff}
main{flex:1;min-width:0;padding:16px}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.c small,.mu{color:var(--mu)}.c b{display:block;font-size:20px;margin:2px 0}.c>b:first-child{font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.kr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.k5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:10px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.m{display:grid;grid-template-columns:1fr 240px;gap:12px;margin-bottom:12px}
.yg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}.ring i{width:32px;height:32px;border-radius:50%;background:var(--card)}
.hb{height:8px;border-radius:6px;background:var(--r);overflow:hidden;width:90px}.hb i{display:block;height:100%;background:var(--g)}
.g{color:var(--g)}.r{color:var(--r)}.p{border-color:var(--g)!important}.l{border-color:var(--r)!important}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.hd h2{margin:0;font-size:18px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dw{text-align:center;color:var(--mu);font-size:12px}
.d{min-height:62px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;text-align:right;font-size:11px;color:var(--mu);cursor:pointer}
.d.o{opacity:.35}.d b{display:block;text-align:center;font-size:13px;margin-top:4px}
.wk{margin-bottom:10px}.wk b{font-size:14px!important}
form,.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:8px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}
.it{padding:8px;border-bottom:1px solid var(--line);cursor:pointer}
.pb{height:10px;background:var(--line);border-radius:6px;margin:8px 0;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
h3{margin:14px 0 6px;font-size:15px}
.dg{display:grid;grid-template-columns:minmax(260px,1fr) 2.4fr;gap:12px;margin-bottom:12px}.col{display:grid;gap:12px;align-content:start}
.cg{display:grid;grid-template-columns:repeat(7,1fr) 100px;gap:6px}.cg .d{min-height:68px;background:var(--bg)}
.cg .d.p{background:color-mix(in srgb,var(--g) 20%,var(--card))}.cg .d.l{background:color-mix(in srgb,var(--r) 20%,var(--card))}.cg .d.z{background:color-mix(in srgb,var(--b) 18%,var(--card));border-color:var(--b)}
.cg .d b{font-size:14px;color:var(--tx)}.cg .d i{display:block;font-style:normal;color:var(--b)}
.wc{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:11px}.wc b{display:block;font-size:15px}
.pill{background:var(--bg);border-radius:10px;padding:1px 7px;font-size:11px;color:var(--mu);white-space:nowrap}.pill.g{color:var(--g)}.pill.r{color:var(--r)}
.sr{width:38px;height:38px;border:3px solid;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.sc{height:8px;border-radius:6px;background:linear-gradient(90deg,#ef6c5b,#f2c94c,#3dbb87);position:relative;margin:8px 0}.sc i{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--g);transform:translateX(-50%)}
.k4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.k7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px}.k7 .c{padding:8px 4px}
@media(max-width:860px){.k4{grid-template-columns:1fr 1fr}.k7{grid-template-columns:repeat(4,1fr)}}
.mw{flex:1;min-width:0}#tg{margin:10px 0 0 16px;background:none;border:0;padding:0;cursor:pointer}.app.cl aside{display:none}
.gal{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ph{position:relative}.ph img{height:120px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}.ph button{position:absolute;top:4px;right:4px;padding:0 6px}
.fb{border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;display:inline-block;background:var(--card);white-space:nowrap}
.zm{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:50;cursor:zoom-out}.zm img{max-width:95%;max-height:95%}
@media(max-width:860px){.dg{grid-template-columns:1fr}.cg{grid-template-columns:repeat(7,1fr) 62px;gap:3px}.cg .d{min-height:54px;padding:2px 3px;font-size:9px}.wc{padding:2px 4px}.wc .pill{display:none}}
@media(max-width:860px){.app{flex-direction:column}aside{width:auto;border:0}nav{display:flex;gap:6px;overflow-x:auto}nav button{width:auto;white-space:nowrap}.k5,.yg{grid-template-columns:1fr 1fr}.g3,.g2,.m{grid-template-columns:1fr}.d{min-height:50px}}
</style></head><body>
<div class="app" id="app"><aside><nav id="nav"></nav><div class="lg" style="font-size:11px;margin:18px 8px 6px;color:var(--mu)">AFFICHAGE</div><div id="um" style="margin:0 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"></div></aside><div class="mw"><button id="tg" data-a="tg" title="Ouvrir / fermer le menu"><span class="lgo"><b>TG</b><b>THE10th</b></span></button><main id="main"></main></div></div>
<script>
const K='journal_tz_v1',$=i=>document.getElementById(i);
let S={t:[],j:{},pb:{},b:10000,gm:0,gy:0,r:100,u:'usd'},pg='dash',sc='month',cur=new Date(),sel='',ed=null,q='',jd='';cur.setDate(1);
try{const x=JSON.parse(localStorage.getItem(K)||localStorage.getItem('journal_pro_v1'));if(x&&x.t)S={...S,...x};else S.t=JSON.parse(localStorage.getItem('journal_trades_v1')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const U=n=>{const a=Math.abs(n),u=S.u||'usd',R=S.r>0?(Math.round(a/S.r*100)/100).toLocaleString('fr-FR')+' R':'',D='$'+(Math.round(a*100)/100).toLocaleString('fr-FR');return u==='r'&&R?R:u==='both'&&R?D+' ('+R+')':D};
const f=n=>(n<0?'-':'+')+U(n);
const cl=n=>n>0?'g':n<0?'r':'',p2=n=>String(n).padStart(2,'0'),E={'+':'😀','0':'😐','-':'😟'};
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const sum=a=>a.reduce((s,t)=>s+t.v,0),Y=()=>String(cur.getFullYear()),YM=()=>Y()+'-'+p2(cur.getMonth()+1);
const srt=a=>[...a].sort((x,y)=>x.d<y.d?-1:1),pf=s=>s.pf===Infinity?'∞':s.pf.toFixed(2);
const dsum=a=>{const d={};a.forEach(t=>d[t.d]=(d[t.d]||0)+t.v);return Object.entries(d).sort((x,y)=>x[0]<y[0]?-1:1)};
function st(a){const n=a.length,w=a.filter(t=>t.v>0),l=a.filter(t=>t.v<0),gw=sum(w),gl=Math.abs(sum(l));let c=0,pk=0,dd=0;
srt(a).forEach(t=>{c+=t.v;pk=Math.max(pk,c);dd=Math.max(dd,pk-c)});
return{n,gw,gl,net:sum(a),wr:n?w.length/n*100:0,pf:gl?gw/gl:(gw?Infinity:0),aw:w.length?gw/w.length:0,al:l.length?gl/l.length:0,dd}}
const sco=()=>sc==='all'?S.t:S.t.filter(t=>t.d.startsWith(sc==='year'?Y():YM()));
const rg=p=>`<div class="ring" style="background:conic-gradient(var(--g) ${p*3.6}deg,var(--r) 0)"><i></i></div>`;
function cum(a){const d=dsum(a);if(d.length<2)return'<p class="mu">Pas assez de données.</p>';let c=0;const p=d.map(x=>c+=x[1]),mn=Math.min(0,...p),mx=Math.max(0,...p),r=mx-mn||1,W=600,H=150,y=z=>H-(z-mn)/r*(H-10)-5,pts=p.map((z,i)=>(i/(p.length-1)*W)+','+y(z)).join(' ');
return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:150px"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--line)" stroke-dasharray="4"/><polygon points="0,${y(0)} ${pts} ${W},${y(0)}" style="fill:var(--ac);opacity:.2"/><polyline fill="none" style="stroke:var(--ac)" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts}"/></svg>`}
function bars(d,lab){if(!d.length)return'<p class="mu">Aucun trade.</p>';const mx=Math.max(1,...d.map(x=>Math.abs(x[1]))),w=600/d.length;
return '<svg viewBox="0 0 600 150" preserveAspectRatio="none" style="width:100%;height:150px"><line x1="0" x2="600" y1="75" y2="75" style="stroke:var(--line)"/>'+d.map((x,i)=>{const h=Math.abs(x[1])/mx*68;return `<rect x="${i*w+w*.15}" width="${w*.7}" y="${x[1]>=0?75-h:75}" height="${h}" style="fill:var(--${x[1]>=0?'g':'r'})"/>`}).join('')+'</svg>'}
function radar(ax){const pt=(i,k)=>{const a=(-90+72*i)*Math.PI/180;return[(110+Math.cos(a)*70*k).toFixed(1),(100+Math.sin(a)*70*k).toFixed(1)]},g=k=>ax.map((_,i)=>pt(i,k).join(',')).join(' ');
return `<svg viewBox="0 0 220 200" style="width:100%;max-width:260px"><polygon points="${g(1)}" fill="none" style="stroke:var(--line)"/><polygon points="${g(.5)}" fill="none" style="stroke:var(--line)"/><polygon points="${ax.map((x,i)=>pt(i,x[1]/100).join(',')).join(' ')}" style="fill:var(--ac);fill-opacity:.35;stroke:var(--ac)"/>`+ax.map((x,i)=>{const p=pt(i,1.3);return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="9" style="fill:var(--mu)">${x[0]}</text>`}).join('')+'</svg>'}
function cal(){const fi=new Date(cur),start=new Date(cur);start.setDate(1-fi.getDay());
const la=new Date(cur.getFullYear(),cur.getMonth()+1,0),rows=Math.ceil((fi.getDay()+la.getDate())/7),sh=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
let h=['D','L','M','M','J','V','S'].map(x=>`<div class="dw">${x}</div>`).join(''),wk=[];
for(let r=0;r<rows;r++){let ws=[],lab=[];
for(let c=0;c<7;c++){const d=new Date(start);d.setDate(start.getDate()+r*7+c);const k=iso(d),im=d.getMonth()===cur.getMonth(),ts=S.t.filter(t=>t.d===k),s=sum(ts);if(im){ws.push(...ts);lab.push(d)}
h+=`<div class="d${im?'':' o'}${ts.length?(s>=0?' p':' l'):''}" data-a="day" data-d="${k}">${d.getDate()}${ts.length?`<b class="${cl(s)}">${f(s)}</b>${ts.length} trade${ts.length>1?'s':''}`:''}</div>`}
if(lab.length)wk.push({n:r+1,ts:ws,a:lab[0],b:lab[lab.length-1]})}
return `<div class="m"><div class="c"><div class="hd"><button data-a="pm">‹</button><h2>${cur.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h2><button data-a="nm">›</button></div><div class="cal">${h}</div></div><div>`+
wk.map(x=>{const s=sum(x.ts);return `<div class="c wk ${x.ts.length?(s>=0?'p':'l'):''}"><div class="kr"><b>Semaine ${x.n}</b><small>${sh(x.a)} – ${sh(x.b)}</small></div><div class="kr"><b class="${cl(s)}">${x.ts.length?f(s):'$0'}</b><small>${x.ts.length} trades</small></div></div>`}).join('')+'</div></div>'}
function rows(a){const k=q.toLowerCase();return '<tr><th>Date</th><th>Paire</th><th>Sens</th><th>Setup</th><th>Émo</th><th>P&amp;L</th><th>Note</th><th></th></tr>'+
a.filter(x=>!k||[x.d,x.p,x.s,x.n].join(' ').toLowerCase().includes(k)).sort((x,y)=>x.d<y.d?1:-1).slice(0,300).map(x=>`<tr><td>${x.d}</td><td>${esc(x.p)}</td><td>${x.x==='S'?'Short':x.x==='L'?'Long':''}</td><td>${esc(x.s)}</td><td>${E[x.e]||''}</td><td class="${cl(x.v)}">${f(x.v)}</td><td>${esc(x.n)}</td><td><button data-a="edit" data-i="${esc(x.id)}">✎</button> <button data-a="del" data-i="${esc(x.id)}">✕</button></td></tr>`).join('')}
function dash(){const a=sco(),s=st(a),d=dsum(a),dp=d.length?d.filter(x=>x[1]>0).length/d.length*100:0,
ax=[['Win %',s.wr],['Profit factor',Math.min(s.pf/3,1)*100],['Gain/Perte',s.al?Math.min(s.aw/s.al/2,1)*100:0],['Drawdown',S.b?Math.max(0,100-s.dd/S.b*1000):50],['Jours gagnants',dp]],
kc=(l,v,sub,x)=>`<div class="c"><div class="kr"><div><small>${l}</small><b>${v}</b><small>${sub}</small></div>${x||''}</div></div>`,
bt=[['month','Mois affiché'],['year','Année'],['all','Tout']].map(([k,l])=>`<button data-a="sc" data-v="${k}" class="${sc===k?'on':''}">${l}</button>`).join('');
return `<div class="bar">${bt}</div><div class="k5">`+
kc('P&amp;L net',`<span class="${cl(s.net)}">${a.length?f(s.net):'$0'}</span>`,s.n+' trades')+
kc('Trade win %',s.wr.toFixed(1)+' %',s.n?'':'–',rg(s.wr))+
kc('Profit factor',pf(s),'gains ÷ pertes',rg(s.gw+s.gl?s.gw/(s.gw+s.gl)*100:0))+
kc('Day win %',dp.toFixed(1)+' %',d.length+' jours',rg(dp))+
kc('Gain moy. / perte moy.',s.al?(s.aw/s.al).toFixed(2):'–',`<span class="g">$${Math.round(s.aw)}</span> / <span class="r">$${Math.round(s.al)}</span>`,`<div class="hb"><i style="width:${s.aw+s.al?s.aw/(s.aw+s.al)*100:50}%"></i></div>`)+
`</div><div class="g3"><div class="c"><b>Score du journal : ${Math.round(ax.reduce((z,x)=>z+x[1],0)/5)}</b>${radar(ax)}</div><div class="c"><b>P&amp;L net cumulé</b>${cum(a)}</div><div class="c"><b>P&amp;L net par jour</b>${bars(d)}</div></div>`+
cal()+`<div class="c tw"><b>Derniers trades</b><table>${rows(S.t.slice(-6))}</table></div>`}
function jr(){const d=jd||iso(new Date()),j=S.j[d]||{},ts=S.t.filter(t=>t.d===d),ks=[...new Set([...Object.keys(S.j),...S.t.map(t=>t.d)])].sort().reverse().slice(0,40);
return `<div class="g2"><div class="c"><b>Journal du ${d}</b><div class="st"><input type="date" id="jdt" value="${d}"><select id="jm">${[['','Humeur'],['+','😀 Bonne'],['0','😐 Neutre'],['-','😟 Difficile']].map(o=>`<option value="${o[0]}"${(j.m\vert{}\vert{}'')===o[0]?' selected':''}>${o[1]}</option>`).join('')Sch('')}</select></div>
<textarea id="jn" rows="9" style="margin-top:8px" placeholder="Plan, exécution, erreurs, leçons…">${esc(j.n)}</textarea>
<div class="bar" style="margin-top:8px"><button class="on" data-a="jsave">Enregistrer</button><button data-a="addday" data-d="${d}">+ Trade ce jour</button></div>
<p class="${cl(sum(ts))}">${ts.length?ts.length+' trade(s) : '+f(sum(ts)):'<span class="mu">Aucun trade ce jour.</span>'}</p></div>
<div class="c"><b>Historique</b>`+ks.map(k=>{const t=S.t.filter(z=>z.d===k),j=S.j[k]||{};return `<div class="it" data-a="jopen" data-d="${k}"><div class="kr"><span>${k} ${E[j.m]||''}</span><span class="${cl(sum(t))}">${t.length?f(sum(t)):''}</span></div><small>${esc((j.n||'').slice(0,90))}</small></div>`}).join('')+'</div></div>'}
function tp(){const e=ed&&S.t.find(t=>String(t.id)===ed)||{},o=(v,l,c)=>`<option value="${v}"${(c||'')===v?' selected':''}>${l}</option>`;
return `<div class="c"><b>${ed?'Modifier le trade':'Nouveau trade'}</b><form id="fo"><input type="date" id="fd" required value="${e.d||sel||iso(new Date())}"><input id="fp" placeholder="Paire" value="${esc(e.p||'EUR/USD')}">
<select id="fx">${o('','Sens',e.x)+o('L','Long',e.x)+o('S','Short',e.x)}</select><input type="number" step="any" id="fv" placeholder="P&amp;L ($)" value="${e.v??''}"><input type="number" step="any" id="fr" placeholder="ou R (ex: 2)"><input id="fs" placeholder="Setup" value="${esc(e.s)}">
<select id="fe">${o('','Émotion',e.e)+o('+','😀 Positive',e.e)+o('0','😐 Neutre',e.e)+o('-','😟 Négative',e.e)}</select><input id="fn" placeholder="Note" value="${esc(e.n)}"><label class="fb">📷 Photos<input type="file" id="ff" accept="image/*" multiple hidden></label><small id="ffn" class="mu"></small><button class="on">${ed?'Enregistrer':'Ajouter'}</button></form></div>
<div class="c tw" style="margin-top:12px"><div class="kr"><b>Registre des trades</b><input id="sq" placeholder="Rechercher…" value="${esc(q)}" style="max-width:220px"></div><table id="tb">${rows(S.t)}</table></div>`}
function bt(ti,fn){const g={};S.t.forEach(t=>(g[fn(t)]=g[fn(t)]||[]).push(t));
return `<div class="c tw"><b>${ti}</b><table><tr><th></th><th>Trades</th><th>Win %</th><th>P&amp;L</th><th>PF</th></tr>`+Object.entries(g).map(([k,a])=>{const s=st(a);return `<tr><td>${esc(k)}</td><td>${s.n}</td><td>${s.wr.toFixed(0)} %</td><td class="${cl(s.net)}">${f(s.net)}</td><td>${pf(s)}</td></tr>`}).join('')+'</table></div>'}
function gl(l,g,n){return `<div class="c"><b>${l}</b>`+(g>0?`<div class="pb"><i style="width:${Math.max(0,Math.min(100,n/g*100))}%"></i></div><div class="kr"><span class="${cl(n)}">${f(n)}</span><small>sur ${U(g)} (${Math.round(n/g*100)} %)</small></div>`:'<p class="mu">Définis l’objectif ci-dessous.</p>')+'</div>'}
